<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none;font-family:'Poppins',sans-serif}
#canvas{width:100%;height:100vh;display:block}
#intro{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease}
#intro.hide{opacity:0;pointer-events:none}
.sun-main{width:120px;height:120px;position:relative;filter:drop-shadow(0 0 25px #ffeb3b) drop-shadow(0 0 50px #ffc107);animation:pulse 2s infinite}
.sun-main::before{content:'🌻';font-size:95px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.glow-ring{position:absolute;inset:-15px;border:2px solid #ffeb3b;border-radius:50%;box-shadow:0 0 20px #ffeb3b, inset 0 0 20px #ffeb3b;animation:rotate 4s linear infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes rotate{to{transform:rotate(360deg)}}
#intro p{margin-top:30px;color:#fff8a6;font-family:'Dancing Script',cursive;font-size:20px;text-shadow:0 0 10px #ffeb3b;letter-spacing:1px;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
#title{position:fixed;top:25px;left:0;width:100%;text-align:center;z-index:10;pointer-events:none;font-family:'Dancing Script',cursive;font-size:28px;color:#ffeb3b;text-shadow:0 0 15px #ffeb3b,0 0 30px #ff9800;opacity:0;transition:opacity 1s 0.5s}
#title.show{opacity:1}
#hint{position:fixed;bottom:20px;width:100%;text-align:center;color:#ffffff70;font-size:12px;z-index:10;pointer-events:none;opacity:0;transition:opacity 1s 2s}
#hint.show{opacity:1}
</style>
