<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Amarillas Para Ti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
  body { margin:0; background:#000; overflow:hidden; }
  canvas { position:fixed; top:0; left:0; width:100%; height:100%; }
  .carta {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    background: linear-gradient(#fffde7, #ffeb3b);
    padding:25px; border-radius:20px;
    box-shadow: 0 0 40px gold;
    text-align:center; width:85%; max-width:300px;
    z-index:10; animation: aparece 2s 4s both;
  }
  .carta h1 { font-family:'Dancing Script'; font-size:32px; margin:5px; color:#4e342e; }
  .carta p { font-family: sans-serif; font-size:14px; color:#5d4037; }
  @keyframes aparece { from{opacity:0; scale:0.5} to{opacity:1; scale:1} }
  .flor { position:absolute; animation: flota 8s linear infinite; }
  @keyframes flota { 0%{transform:translateY(110vh); opacity:1} 100%{transform:translateY(-10vh); opacity:0} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="carta">
  <div style="font-size:40px">🌻💛🌻</div>
  <h1>Mi amor</h1>
  <p>Estas flores amarillas son para ti, porque iluminas cada uno de mis días con tu sonrisa hermosa.</p>
  <p><b>Te Amo Mucho<br>Feliz día de las flores amarillas</b></p>
  <p style="font-size:12px">Para ti 💛</p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
function heart(t){
  return {
    x: 16*Math.pow(Math.sin(t),3),
    y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
  }
}
for(let i=0;i<500;i++){
  let t = Math.random()*Math.PI*2;
  let h = heart(t);
  particles.push({
    x: canvas.width/2 + h.x*13,
    y: canvas.height/2 + h.y*11 - 30,
    vx: (Math.random()-0.5),
    vy: (Math.random()-0.5),
    s: Math.random()*2+1
  })
}
function draw(){
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#FFEB3B';
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();

// flores flotando con frases
const frases = ["Te Amo","Eres mi sol","Eres preciosa","Me encantas","Mi Amor","Eres mi todo","Siempre juntos"];
setInterval(()=>{
  const d = document.createElement('div');
  d.className='flor';
  d.style.left = Math.random()*90+'vw';
  d.innerHTML = '🌻<br><span style="color:#ffeb3b;font-size:10px;font-family:sans-serif">'+frases[Math.floor(Math.random()*frases.length)]+'</span>';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),8000);
},350);
</script>
</body>
</html>
