<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores Amarillas 💛</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scene">

        <!-- Estrellas -->
        <div class="stars"></div>

        <!-- Corazón -->
        <div class="heart">💛</div>

        <!-- Flores -->
        <div class="flower f1">🌻</div>
        <div class="flower f2">🌼</div>
        <div class="flower f3">🌻</div>
        <div class="flower f4">🌼</div>
        <div class="flower f5">🌻</div>
        <div class="flower f6">🌼</div>
        <div class="flower f7">🌻</div>
        <div class="flower f8">🌼</div>

        <!-- Mensaje -->
        <div class="message">
            <p>Te amo 💛</p>
            <span>Estas flores son para ti</span>
        </div>

        <!-- Ramo -->
        <div class="flower bouquet">💐</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
